name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  release:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Write bakeable configs from secrets
        shell: pwsh
        run: |
          @{ discordWebhookUrl = "${{ secrets.DISCORD_BUG_REPORT_WEBHOOK }}" } | ConvertTo-Json | Set-Content webhook-config.generated.json
          @{ url = "https://telemetria.tiklivetts.es/api/ingest"; token = "${{ secrets.INGEST_TOKEN }}" } | ConvertTo-Json | Set-Content telemetry-config.generated.json
          @{ appKey = "${{ secrets.APTABASE_APP_KEY }}"; host = "https://aptabase.tiklivetts.es" } | ConvertTo-Json | Set-Content aptabase-config.generated.json

      - name: Build & publish installer
        run: npm run build:electron -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
