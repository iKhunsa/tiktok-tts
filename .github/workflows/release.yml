name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  release:
    needs: test
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Write bug-report webhook config
        shell: pwsh
        run: |
          $config = @{ discordWebhookUrl = "${{ secrets.DISCORD_BUG_REPORT_WEBHOOK }}" } | ConvertTo-Json
          Set-Content -Path webhook-config.generated.json -Value $config

      - name: Write telemetry config
        shell: pwsh
        run: |
          $config = @{ url = "https://telemetria.tiklivetts.es/api/ingest"; token = "${{ secrets.INGEST_TOKEN }}" } | ConvertTo-Json
          Set-Content -Path telemetry-config.generated.json -Value $config

      - name: Build & publish installer
        run: npm run build:electron -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
