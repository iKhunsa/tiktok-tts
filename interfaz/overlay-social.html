<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Overlay — Social</title>
  <link rel="stylesheet" href="./compartido/tema-overlay.css">
  <style>
    body {
      background: transparent;
      width: 480px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body.layout-rows { width: 260px; }
    body.has-bgimg {
      background-image: var(--bg-img);
      background-size: cover;
      background-position: center;
    }
    .container { display: flex; gap: 10px; }
    body.layout-rows .container { flex-direction: column; }
    .panel {
      flex: 1;
      background: rgba(0,0,0,var(--bg-alpha));
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 16px;
      padding: 12px 14px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      min-width: 0;
    }
    .panel-header {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
      padding-bottom: 7px;
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }
    .panel-icon { font-size: 14px; }
    .panel-title {
      font-size: 9px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 700;
    }
    .panel-count {
      margin-left: auto;
      font-size: 10px;
      color: rgba(255,255,255,0.4);
    }
    .entry-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-height: 240px;
      overflow: hidden;
    }
    .entry {
      display: flex;
      align-items: center;
      gap: 8px;
      animation: slide-in 0.35s cubic-bezier(0.34,1.56,0.64,1);
    }
    @keyframes slide-in {
      from { opacity: 0; transform: translateX(-12px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    .entry-avatar {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: rgba(255,255,255,0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 700;
      color: var(--accent);
      flex-shrink: 0;
    }
    .entry-name {
      font-size: 12px;
      color: #fff;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .empty {
      font-size: 11px;
      color: rgba(255,255,255,0.25);
      text-align: center;
      padding: 10px 0;
    }
    body.reduce-motion .entry { animation: none; }
    @media (prefers-reduced-motion: reduce) {
      .entry { animation: none; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="panel" id="panel-follows">
      <div class="panel-header">
        <span class="panel-icon">💜</span>
        <span class="panel-title" data-i18n="overlayStr.followers">Seguidores</span>
        <span class="panel-count" id="count-follows">0</span>
      </div>
      <div class="entry-list" id="list-follows">
        <div class="empty" data-i18n="overlayStr.noFollowers">Sin seguidores aún</div>
      </div>
    </div>
    <div class="panel" id="panel-shares">
      <div class="panel-header">
        <span class="panel-icon">🔗</span>
        <span class="panel-title" data-i18n="overlayStr.sharedList">Compartidos</span>
        <span class="panel-count" id="count-shares">0</span>
      </div>
      <div class="entry-list" id="list-shares">
        <div class="empty" data-i18n="overlayStr.noShared">Sin compartidos aún</div>
      </div>
    </div>
  </div>
  <script type="module" src="./overlay-social.js"></script>
</body>
</html>
