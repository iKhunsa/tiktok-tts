<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Overlay — Bot de Música</title>
  <link rel="stylesheet" href="./compartido/tema-overlay.css">
  <link rel="stylesheet" href="./compartido/estilo/estilo-texto.css">
  <style>
    body {
      background: transparent;
      width: 420px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }
    .tarjeta {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 16px 12px 12px;
      background: rgba(8, 8, 8, var(--bg-alpha));
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 18px;
      color: #fff;
    }
    .tarjeta.entrando { animation: entrar 0.3s cubic-bezier(0.23, 1, 0.32, 1); }
    .tarjeta[hidden] { display: none; }
    @keyframes entrar {
      from { opacity: 0; transform: translateY(10px) scale(0.98); }
      to   { opacity: 1; transform: none; }
    }
    .portada {
      flex-shrink: 0;
      width: 64px;
      height: 64px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      overflow: hidden;
    }
    .portada img { width: 34px; height: 34px; filter: brightness(0) invert(1); }
    .portada img.miniatura { width: 100%; height: 100%; object-fit: cover; filter: none; }
    .info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
    .etiqueta { font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--accent); }
    .titulo { font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .detalle { font-size: 12px; opacity: 0.75; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .detalle:empty { display: none; }
    body.reduce-motion .tarjeta.entrando { animation: none; }
    @media (prefers-reduced-motion: reduce) { .tarjeta.entrando { animation: none; } }
  </style>
</head>
<body>
  <div class="tarjeta" id="tarjeta" hidden>
    <div class="portada"><img id="portada" src="icons/music_note.svg" alt=""></div>
    <div class="info">
      <div class="etiqueta" data-i18n="overlayCat.musicaSonando">Sonando ahora</div>
      <div class="titulo" id="titulo"></div>
      <div class="detalle" id="detalle"></div>
    </div>
  </div>
  <script type="module" src="./overlay-musica.js"></script>
</body>
</html>
