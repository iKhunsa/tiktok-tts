<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Overlay — Chat Unificado</title>
  <link rel="stylesheet" href="./compartido/tema-overlay.css">
  <style>
    :root {
      --font-size: 14px;
      --tiktok: #fe2c55;
      --twitch: #9146ff;
      --youtube: #ff0000;
      --kick: #53fc18;
      --bg-img: none;
    }
    body {
      background: transparent;
      width: 420px;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 8px;
      gap: 5px;
    }
    body.has-bgimg {
      background-image: var(--bg-img);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }
    #chat-container { display: flex; flex-direction: column; gap: 5px; overflow: hidden; }
    .msg {
      display: flex;
      align-items: flex-start;
      gap: 7px;
      background: rgba(8, 8, 8, var(--bg-alpha));
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 7px 11px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      animation: slideUp 0.3s cubic-bezier(0.34,1.56,0.64,1) forwards;
      font-size: var(--font-size);
      line-height: 1.4;
      word-break: break-word;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(12px) scale(0.96); }
      to   { opacity: 1; transform: translateY(0)    scale(1);    }
    }
    .platform-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      flex-shrink: 0;
      margin-top: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 8px;
      font-weight: 700;
      color: rgba(0,0,0,0.55);
      line-height: 1;
    }
    .dot-tiktok  { background: var(--tiktok); }
    .dot-twitch  { background: var(--twitch); }
    .dot-youtube { background: var(--youtube); }
    .dot-kick    { background: var(--kick); }
    body.reduce-motion .msg { animation: none; }
    @media (prefers-reduced-motion: reduce) {
      .msg { animation: none; }
    }
    .msg-user {
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 120px;
      flex-shrink: 0;
      font-size: calc(var(--font-size) - 1px);
    }
    .msg-sep { color: rgba(255,255,255,0.35); flex-shrink: 0; font-size: calc(var(--font-size) - 1px); }
    .msg-text { color: rgba(255,255,255,0.88); flex: 1; min-width: 0; }
    .msg-body { display: flex; align-items: baseline; gap: 5px; flex: 1; min-width: 0; }
    .chat-emote {
      height: 18px;
      width: auto;
      vertical-align: middle;
      display: inline-block;
      margin: 0 1px;
    }
  </style>
</head>
<body>
  <div id="chat-container"></div>
  <script type="module" src="./overlay-chat.js"></script>
</body>
</html>
