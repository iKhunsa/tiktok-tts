<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Overlay — Teclado</title>
  <link rel="stylesheet" href="./compartido/tema-overlay.css">
  <link rel="stylesheet" href="./compartido/estilo/estilo-texto.css">
  <style>
    /* Tema oscuro (por defecto) y claro -- mismas dos variantes que trae
       Inkput (la app de referencia), con los tokens propios de TTS en vez
       de los suyos (nada de tinta/papel: tarjeta plana + --accent). */
    html:root {
      --accent: #38bdf8; --bg-alpha: .84;
      --surf: rgba(0, 0, 0, var(--bg-alpha)); --edge: rgba(255, 255, 255, .14);
      --ink: rgba(255, 255, 255, .92); --label: rgba(255, 255, 255, .55);
      --slot: rgba(255, 255, 255, .08); --ridge: rgba(255, 255, 255, .25); --on-ink: #0b0b0f;
    }
    body.tema-claro {
      --surf: rgba(255, 255, 255, var(--bg-alpha)); --edge: rgba(0, 0, 0, .14);
      --ink: rgba(14, 14, 15, .92); --label: rgba(14, 14, 15, .55);
      --slot: rgba(0, 0, 0, .08); --ridge: rgba(0, 0, 0, .3); --on-ink: #fff;
    }
    body { display: grid; min-width: 360px; min-height: 170px; place-items: center; background: transparent; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
    .tecl-stage { position: relative; }
    .tecl-key {
      position: absolute; display: flex; align-items: center; justify-content: center;
      color: var(--ink); background: var(--surf); border: 1px solid var(--edge);
      border-radius: 10px; font-size: 13px; font-weight: 700; letter-spacing: .02em;
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      transition: background 60ms ease, color 60ms ease, transform 60ms ease;
    }
    .tecl-key.on { background: var(--accent); color: var(--on-ink); transform: scale(.96); }
    .tecl-mouse { position: absolute; }
    .mouse-svg { display: block; width: 100%; height: 100%; }
    .mouse-svg .m-body { fill: var(--surf); stroke: var(--edge); stroke-width: 2; vector-effect: non-scaling-stroke; }
    .mouse-svg .m-slot { fill: var(--slot); }
    .mouse-svg .m-ridge { fill: none; stroke: var(--ridge); stroke-width: 1.2; vector-effect: non-scaling-stroke; }
    .mouse-svg .shape { fill: transparent; stroke: var(--edge); stroke-width: 1.4; vector-effect: non-scaling-stroke; transition: fill 60ms ease; }
    .mouse-svg .m-part.on .shape { fill: var(--accent); }
    .mouse-svg text { font: 700 7px Inter, sans-serif; fill: var(--label); text-anchor: middle; pointer-events: none; }
    .mouse-svg .m-part.on text { fill: var(--on-ink); }
    body.reduce-motion .tecl-key, body.reduce-motion .mouse-svg .shape { transition: none; }
  </style>
</head>
<body>
  <div class="tecl-stage" id="tecladoStage"></div>
  <script type="module" src="./overlay-teclado.js"></script>
</body>
</html>
