<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Overlay — Alerta de evento</title>
  <link rel="stylesheet" href="./compartido/tema-overlay.css">
  <link rel="stylesheet" href="./compartido/estilo/estilo-texto.css">
  <style>
    :root { --bg-alpha: 0.90; }
    body {
      background: transparent;
      width: 440px;
      min-height: 120px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }
    .alert-card {
      background: rgba(8, 8, 8, var(--bg-alpha));
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 16px 18px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 14px;
      animation: entrar 0.3s cubic-bezier(0.23, 1, 0.32, 1) forwards;
    }
    .alert-card.leaving { animation: salir 0.2s ease-out forwards; }
    @keyframes entrar {
      from { opacity: 0; transform: translateY(-16px) scale(0.96); }
      to   { opacity: 1; transform: none; }
    }
    @keyframes salir {
      from { opacity: 1; transform: none; }
      to   { opacity: 0; transform: translateY(-10px) scale(0.98); }
    }
    .icono {
      flex-shrink: 0;
      width: 64px;
      height: 64px;
      display: grid;
      place-items: center;
    }
    .icono img { width: 44px; height: 44px; filter: brightness(0) invert(1); }
    .icono img.sticker { width: 100%; height: 100%; object-fit: contain; filter: none; }
    .icono img.regalo-kick { object-fit: cover; } /* el regalo es apaisado: entero en 64px apenas se distinguen los niveles */
    .info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; color: #fff; }
    .etiqueta { font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; opacity: 0.7; }
    .nombre {
      font-size: 20px;
      font-weight: 800;
      color: var(--accent);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .accion { font-size: 13px; opacity: 0.85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .insignia {
      flex-shrink: 0;
      background: color-mix(in srgb, var(--accent) 14%, transparent);
      border: 1px solid color-mix(in srgb, var(--accent) 32%, transparent);
      color: var(--accent);
      font-size: 14px;
      font-weight: 700;
      padding: 5px 10px;
      border-radius: 999px;
    }
    body.reduce-motion .alert-card { animation-duration: 0.01s !important; }
    @media (prefers-reduced-motion: reduce) { .alert-card { animation-duration: 0.01s !important; } }
  </style>
</head>
<body>
  <script type="module" src="./overlay-evento.js"></script>
</body>
</html>
