<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Overlay — Seguidores</title>
  <link rel="stylesheet" href="./compartido/tema-overlay.css">
  <style>
    body {
      background: transparent;
      width: 200px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body.has-bgimg {
      background-image: var(--bg-img);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }
    .card {
      background: rgba(0, 0, 0, var(--bg-alpha));
      border: 1px solid rgba(255, 255, 255, 0.10);
      border-radius: 18px;
      padding: 22px 16px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .icon { font-size: 22px; line-height: 1; }
    .label {
      font-size: 10px;
      letter-spacing: 1.6px;
      text-transform: uppercase;
      color: #fff;
      text-align: center;
    }
    .count {
      font-size: 56px;
      font-weight: 800;
      color: #fff;
      line-height: 1;
      letter-spacing: -2px;
      font-variant-numeric: tabular-nums;
    }
    .count.bump { animation: bump 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }
    @keyframes bump {
      0%   { transform: scale(1); color: #fff; }
      35%  { transform: scale(1.28); color: var(--accent); }
      100% { transform: scale(1); color: #fff; }
    }
    .divider {
      width: 100%;
      height: 1px;
      background: rgba(255, 255, 255, 0.07);
    }
    .goal-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .goal-bar-track {
      width: 100%;
      height: 5px;
      background: rgba(255, 255, 255, 0.10);
      border-radius: 999px;
      overflow: hidden;
    }
    .goal-bar-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 999px;
      transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
      min-width: 0%;
    }
    .goal-numbers {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: #fff;
      font-variant-numeric: tabular-nums;
    }
    .goal-current { color: #fff; font-weight: 600; }
    body.reduce-motion .count.bump { animation: none; }
    @media (prefers-reduced-motion: reduce) {
      .count.bump { animation: none; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon"><img class="icon-inline" src="icons/people.svg" alt=""></div>
    <div class="label" data-i18n="overlayStr.newFollowers">Nuevos seguidores</div>
    <div class="count" id="count">0</div>
    <div class="divider" id="divider" style="display:none"></div>
    <div class="goal-section" id="goalSection" style="display:none">
      <div class="goal-bar-track">
        <div class="goal-bar-fill" id="goalBar" style="width:0%"></div>
      </div>
      <div class="goal-numbers">
        <span class="goal-current" id="goalCurrent">0</span>
        <span id="goalTarget">0</span>
      </div>
    </div>
  </div>
  <script type="module" src="./overlay-seguidores.js"></script>
</body>
</html>
